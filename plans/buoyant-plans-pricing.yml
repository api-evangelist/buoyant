specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Buoyant
providerId: buoyant
generated: '2026-09-04'
method: searched
source: https://www.buoyant.io/pricing
created: '2026-05-04'
modified: '2026-09-04'
note: >-
  REPLACES a 2026-05-04 bulk-sweep scaffold that carried invented tiers, request quotas
  and per-minute rate limits for an API surface Buoyant does not sell. Buoyant does not
  meter API requests at all — Buoyant Enterprise for Linkerd was priced per pod when
  per-pod pricing was introduced in 2024, and the pricing page now publishes NO prices
  for either paid tier. plan_count is 3, published_price_count is 0.
plan_count: 3
published_price_count: 0
pricing_model: >-
  Tiered commercial subscription for Buoyant Enterprise for Linkerd on top of a free,
  Apache-2.0 open-source project. Not request-metered.
free_usage_policy: >-
  "Companies with fewer than 50 employees can also run BEL for production use, at any
  scale." All tiers are described as always free to try.
plans:
  - id: buoyant-open-source
    name: Open Source
    type: free
    price: '0.00'
    currency: USD
    billing_period: none
    description: >-
      Open-source Linkerd under Apache-2.0. Community support via the Buoyant Linkerd
      public forums.
    elements:
      - name: Zero-downtime deploys and upgrades
      - name: Community support via the Buoyant Linkerd public forums
    limits: []
  - id: buoyant-premium
    name: Premium
    type: paid
    price: null
    currency: USD
    billing_period: unpublished
    cta: Get Premium
    description: >-
      "For companies standardizing on security, high availability, and multi-cluster
      communication." Price is not published; the call to action is a contact form.
    elements:
      - name: Stable release artifacts
      - name: Automated installs and upgrades
      - name: SLAs on CVE remediation
      - name: Mutual TLS and basic service mesh featureset
      - name: Multi-cluster communication
      - name: L7 network security policies
      - name: Automatic cross-cluster failover
      - name: Support for Linux VM workloads
      - name: Private support ticketing
    limits: []
  - id: buoyant-strategic
    name: Strategic
    type: enterprise
    price: null
    currency: USD
    billing_period: unpublished
    cta: Get Strategic
    description: >-
      "For enterprises with special security, compliance, and additional operational
      requirements." Everything in Premium, plus the entitlements below. Includes a
      30-day onboarding and architecture review. Price is not published.
    elements:
      - name: Everything in Premium
      - name: Hotpatch releases and SBOMs
      - name: High Availability Zone-aware Load Balancing (HAZL)
      - name: FIPS 140-3 and 140-2 validated cryptography (optional)
      - name: Enterprise support with 24x7 SLAs
      - name: 30-day onboarding and architecture review
    limits: []
related:
