        url: packages/buoyant-packages.yml
  - aid: buoyant:buoyant-cloud
    name: Buoyant Cloud
    description: >-
      Buoyant Cloud is the hosted control surface for Linkerd fleets — health checks,
      golden metrics, multi-cluster link management and automated Linkerd upgrades.
      Clusters connect through the Buoyant Cloud agent (the linkerd-buoyant Helm
      chart), which authenticates with an org-scoped client ID and secret and speaks
      gRPC to api.buoyant.cloud. There is no public REST developer API: the endpoint
      answers every non-gRPC request with HTTP 415 and grpc-status 3 (probed
      2026-09-04), and Buoyant documents it only as the host its own agent calls.
    humanURL: https://buoyant.cloud/
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/buoyant.png
    baseURL: https://api.buoyant.cloud
    tags:
