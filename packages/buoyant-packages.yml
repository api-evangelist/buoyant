specification: API Commons Packages
specificationVersion: '0.1'
provider: Buoyant
providerId: buoyant
generated: '2026-09-04'
method: searched
source: >-
  Registry metadata read live on 2026-09-04 from helm.buoyant.cloud/index.yaml,
  helm.linkerd.io/{stable,edge}/index.yaml, proxy.golang.org, crates.io and the
  BuoyantIO/homebrew-linkerd tap. npm, PyPI, NuGet, RubyGems, Packagist and Maven
  Central were checked and hold no first-party Buoyant or Linkerd client library.
note: >-
  Buoyant does not distribute REST/gRPC client SDKs. Its shipped artifacts are Helm
  charts, Go modules, a Rust crate of the proxy gRPC bindings, and CLI installers.
  Only the Buoyant-operated Helm repo (helm.buoyant.cloud) and the Linkerd edge
  channel are actively released; the open-source stable Helm channel and the Homebrew
  tap have not moved since 2024 and 2023 respectively, which is recorded below as a
  currency finding rather than a defect in the enterprise product.
